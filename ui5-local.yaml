specVersion: "4.0"
metadata:
  name: cus.sd.zsalesorder.create
type: application
framework:
  name: SAPUI5
  version: 1.79.0
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: sap.ca.scfld.md
    - name: sap.collaboration
    - name: sap.f
    - name: sap.ui.comp
    - name: sap.ui.generic.app
    - name: sap.ui.table
    - name: sap.ushell
    - name: sap.ca.ui
    - name: themelib_sap_bluecrystal
    - name: themelib_sap_fiori_3
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertErrors: false
        backend:
          - path: /sap
            url: http://gwdevs:4431
            destination: GWDEV_BAS_BASICAUTH_100167
          - name: sap-fe-mockserver
        beforeMiddleware: csp
        configuration:
        mountPath: /
        services:
          - urlPath: /sap/opu/odata/sap/ZSRA017_SALESORDER_CREATE_SRV
            metadataPath: ./webapp/localService/mainService/metadata.xml
            mockdataPath: ./webapp/localService/mainService/data
            generateMockData: true
        annotations: []
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        component: cus.sd.zsalesorder.create
        ui5Theme: sap_fiori_3
